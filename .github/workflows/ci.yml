name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.3.1"

      - name: Check formatting with gdformat
        run: gdformat --check addons/leadr/**/*.gd

      - name: Lint with gdlint
        run: gdlint addons/leadr/**/*.gd

  validate:
    name: Validate Godot Project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Validate project
        run: |
          # Import project to validate it loads without errors
          ./Godot_v4.3-stable_linux.x86_64 --headless --import . 2>&1

  version-check:
    name: Version Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check versions match
        run: |
          PLUGIN_VER=$(grep '^version=' addons/leadr/plugin.cfg | cut -d'"' -f2)
          GD_VER=$(grep '^const VALUE' addons/leadr/internal/version.gd | cut -d'"' -f2)
          PROJECT_VER=$(grep '^config/version=' project.godot | cut -d'"' -f2)

          echo "plugin.cfg: $PLUGIN_VER"
          echo "version.gd: $GD_VER"
          echo "project.godot: $PROJECT_VER"

          if [[ "$PLUGIN_VER" != "$GD_VER" || "$PLUGIN_VER" != "$PROJECT_VER" ]]; then
            echo "::error::Version mismatch! All 3 files must have same version."
            exit 1
          fi
          echo "All versions match: $PLUGIN_VER"
